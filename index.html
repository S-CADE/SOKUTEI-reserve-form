<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>予約フォーム</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body{font-family:sans-serif;margin:0;padding:16px;max-width:480px}
  label{display:block;margin:14px 0 4px;font-weight:bold}
  input,select,button{font-size:16px;padding:10px;width:100%;box-sizing:border-box}
  .row{display:flex;gap:8px} .row button{width:90px}
  #map{height:260px;margin-top:8px;border-radius:8px}
  #addr{font-size:14px;color:#555}
  #submit{margin-top:20px;background:#06c755;color:#fff;border:0;border-radius:8px}
  #err{color:#d00;font-size:14px}
</style>
</head>
<body>
<form id="f">
  <label>希望日</label><input type="date" id="date" required>
  <label>希望時間</label><input type="time" id="time" required>

  <label>場所（地図タップ・検索・現在地）</label>
  <div class="row"><input id="q" placeholder="住所・施設名"><button type="button" id="search">検索</button></div>
  <button type="button" id="here" style="margin-top:8px">📍 現在地を使う</button>
  <div id="map"></div>
  <p id="addr">地図をタップして場所を選んでください</p>

  <label>種目</label>
  <select id="event" required>
    <option value="">選択してください</option>
    <option>サッカー</option><option>野球</option><option>バスケ</option>
    <option>ハンドボール</option><option>バレー</option><option>アメフト</option>
  </select>

  <label>人数</label>
  <input id="count" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="例：75" required>

  <p id="err"></p>
  <button id="submit" type="submit">送信</button>
</form>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
